universe:
  mode: "sp500"
  extra: ["NVDA","ANET","PANW","CRWD","RTX","VUG","SOXX"]
  min_price: 5
  min_avg_volume: 1000000
  buffett_mode: "hybrid"   # options: "signals_only" | "hybrid" | "sp500_only"

risk:
  max_position_pct: 10
  tranche_plan: [30,30,20,20]
  stop_below_ma_pct: 5

# ---- Intraday / PROD knobs (long + short) ----
intraday:
  # Keep intraday as your current balanced profile (C-style)
  adx_min_long: 18.0

  long:
    # Confirms a BUY on ≥ vol_pace_min; NEAR uses ≥ near_vol_pace_min
    vol_pace_min: 1.3          # TRIG min full-day volume vs 50dma
    near_vol_pace_min: 1.0     # NEAR min full-day volume vs 50dma
    sell_intrabar_vol_pace_min: 1.2

    # Text/logic thresholds (used by long intraday watcher)
    confirm_headroom_pct: 0.4      # "% over pivot" headroom for confirm
    near_below_pivot_pct: 0.3      # NEAR = within this % below pivot
    crack_ma_pct: 0.5              # SELL trigger = below MA150 by this %
    min_elapsed_minutes: 40        # 60m bars elapsed requirement
    ma_proxy_length: 150           # MA150 as 30-wk proxy

  short:
    # Core short trigger shape — these override weinstein_short_core defaults
    break_pct: 0.004                # ≈0.4% below pivot/MA required for TRIG
    near_above_pivot_pct: 0.01      # NEAR zone just above breakdown
    vol_pace_min: 1.3               # TRIG: projected full-day vol vs 50dma
    near_vol_pace_min: 1.0          # NEAR: projected full-day vol vs 50dma

    # 60m intrabar confirmations
    intrabar_confirm_min_elapsed: 30  # minutes elapsed in current bar
    intrabar_volpace_min: 1.2         # intrabar volume pace vs recent bars

    # Stateful promotion knobs (NEAR → ARMED → TRIGGERED → COOLDOWN)
    near_hits_window: 5            # window of scans to accumulate hits
    near_hits_min: 3               # hits needed in window to ARM
    cooldown_scans: 4              # cooldown scans after a TRIGGER

    # READY-to-close + risk “order block” text
    ready_above_ma_pct: 0.005      # ≈0.5% above MA150 to call READY-to-close
    stop_hard_pct: 0.20            # 20% disaster stop (short side)
    trail_atr_mult: 2.0            # ATR×2.0 trail
    ma_guard_pct: 0.03             # MA150 +3% as guard for stops
    target1_pct: 0.15              # 15% downside target
    target2_pct: 0.20              # 20% downside target

  # Breadth for intraday (still OFF)
  breadth:
    enabled: false
    ma_window: 50
    min_long: 0.50        # ignored when enabled=false; kept for future tests

  regime:
    use_long: true        # gate LONG intraday signals by regime
    use_short: true       # gate SHORT intraday signals by regime
                          # → market_regime decides which side is active

# ---- Crypto weekly block, fed by your Signals tab ----
crypto:
  enabled: true
  benchmark: "BTC-USD"

  # Pull the crypto watchlist from the Signals tab, not from a static list
  source: "signals"                 # options: "signals" | "list"

  # How to find crypto rows inside "Signals"
  signals_filter:
    include_directions: ["BUY"]     # only the names you’re actively watching/holding as BUY signals
    include_timeframes: ["short","mid","long"]  # consider all, or narrow if you want
    ticker_regex: "-USD$"           # treat rows whose Ticker ends with "-USD" as crypto
    allow_blank_price: true
    min_unique: 1

  # What to compute and show per-coin
  metrics:
    include:
      - "stage"
      - "short_term_state_wk"
      - "price"
      - "ma10"
      - "ma30"
      - "dist_ma_pct"
      - "ma_slope_per_wk"
      - "rs"
      - "rs_ma30"
      - "rs_above_ma"
      - "rs_slope_per_wk"
      - "notes"
    stage_method: "weinstien"
    rs_anchor: "benchmark"

  sparkline:
    enabled: true
    lookback_days: 21
    width_px: 80
    height_px: 20
    pad_px: 2
    ma_windows: [10, 30]
    show_markers: false

  table:
    title: "Crypto Weekly — Benchmark: BTC-USD"
    uppercase_signals: true
    buy_label: "Buy"
    watch_label: "Watch"
    avoid_label: "Avoid"
    show_summary_line: true

# ---- Email section visibility toggles ----
sections:
  header: true
  buy_triggers: true
  near_triggers: true
  sell_triggers: true
  charts: true
  sell_risk_triggers: true
  snapshot: true
  crypto_weekly_from_signals: true
  weekly_summary: true

# ---- Optional formatting niceties ----
formatting:
  number_format:
    percent: "0.00'%'"
    price: "0.00"
  emoji:
    buy: "✅"
    watch: "🟡"
    avoid: "🔴"

# ---- Backtest / SIM knobs (Option A: LONG-only until shorts are fully wired) ----
backtest:
  snapshot_mode: "auto"        # use historical weekly weekly snapshots where available

  regime:
    use_long: true             # LONGs gated by Chapter 8 regime
    use_short: true            # ✅ Option A: keep structural shorts OFF for now

  # Coppock curve filters (on benchmark, e.g., SPY)
  coppock:
    use_long: true             # LONG: require Coppock(benchmark) > 0
    use_short: false

  # Profile A – breadth ON (extra safety)
  breadth:
    enabled: true              # ✅ require broad market participation
    ma_window: 50
    min_long: 0.60             # at least 60% of names above MA50 to allow longs

  # Market-level trend / risk filters (Weinstein-style)
  market:
    require_rising_ma30: true  # only trade when SPY 30-week MA is flat-to-rising (for longs)
    ma30_slope_min: 0.0        # slope >= 0
    vix_max: 25.0              # suppress new longs when VIX is in panic/crash mode

  # Industry group filters (Stage 2 confirmation)
  industry:
    enabled: true
    require_stage2: true
    min_stage2_frac: 0.30
    require_rising_ma30: true
    require_rising_rs: true

  # backtest logging controls
  logging:
    show_adx_skips: false
    show_breadth_skips: false
    show_coppock_skips: false

  # Long-only, very selective entries
  long:
    break_pct: 0.0060
    vol_min: 1.50
    adx_min: 20.0
    stop_hard: 0.20
    trail_atr: 2.0
    ma_guard: 0.03
    require_ma30_rising: true
    ma30_slope_min: 0.0

  # Short block is defined but not used in Option A (use_short=false)
  short:
    require_falling_ma30: true
    ma30_slope_max: 0.0     # <= 0 means flat-to-falling is OK for shorts
    break_pct: 0.0060
    vol_min: 1.60
    adx_min: 22.0
    stop_hard: 0.18
    trail_atr: 2.0
    ma_guard: 0.04
    # NEW: optional failed-rally filter (short rollovers after a bounce)
    require_failed_rally: true
    failed_rally_lookback: 10
    failed_rally_pct: 0.02
    # ✅ NEW: market gate for shorts (SPY must be falling)
    ma30_slope_min_short: 0.0

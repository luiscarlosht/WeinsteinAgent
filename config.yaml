app:
  mode_default: weekly
  timezone: America/Chicago
  benchmark: SPY
  include_charts: true
  ordering:
    account_size: 5000
    risk_per_trade_pct: 0.005
    take_profit_R: [1.0, 2.0]
    round_qty_to: 1

sheets:
  url: "https://docs.google.com/spreadsheets/d/17eYLngeM_SbasWRVSy748J-RltTRli1_4od6mlZnpW4/edit"
  sheet_url: "https://docs.google.com/spreadsheets/d/17eYLngeM_SbasWRVSy748J-RltTRli1_4od6mlZnpW4/edit"
  open_positions_tab: "Open_Positions"
  signals_tab: "Signals"
  output_dir: "./output"

google:
  service_account_json: "/home/luiscarlosht/WeinsteinAgent/creds/gcp_service_account.json"
  client_email: "500633565449-compute@developer.gserviceaccount.com"

notifications:
  email:
    enabled: true
    sender: "luiscarlosht@gmail.com"
    recipients:
      - "luiscarloshernandez@hotmail.com"
      - "luiscarlosht@gmail.com"
    subject_prefix: "Weinstein Report READY"
    provider: "smtp"
    smtp:
      host: "smtp.gmail.com"
      port_ssl: 587
      username: "luiscarlosht@gmail.com"
      app_password: "REPLACE_WITH_YOUR_GMAIL_APP_PASSWORD"

reporting:
  output_dir: "/home/luiscarlosht/WeinsteinAgent/output"
  include_pdf: true
  include_csv: true
  summary_lines: 10
  section_order:
    - header
    - buy_triggers
    - near_triggers
    - sell_triggers
    - charts
    - sell_risk_triggers
    - snapshot
    - crypto_weekly_from_signals
    - weekly_summary

universe:
  mode: "sp500"
  extra: ["NVDA","ANET","PANW","CRWD","RTX","VUG","SOXX"]
  min_price: 5
  min_avg_volume: 1000000
  buffett_mode: "hybrid"

risk:
  max_position_pct: 10
  tranche_plan: [30,30,20,20]
  stop_below_ma_pct: 5

# =========================
# INTRADAY (unchanged)
# =========================
intraday:
  adx_min_long: 18.0

  long:
    vol_pace_min: 1.3
    near_vol_pace_min: 1.0
    sell_intrabar_vol_pace_min: 1.2
    confirm_headroom_pct: 0.4
    near_below_pivot_pct: 0.3
    crack_ma_pct: 0.5
    min_elapsed_minutes: 40
    ma_proxy_length: 150

  short:
    break_pct: 0.004
    near_above_pivot_pct: 0.01
    vol_pace_min: 1.3
    near_vol_pace_min: 1.0
    intrabar_confirm_min_elapsed: 30
    intrabar_volpace_min: 1.2
    near_hits_window: 5
    near_hits_min: 3
    cooldown_scans: 4
    ready_above_ma_pct: 0.005
    stop_hard_pct: 0.20
    trail_atr_mult: 2.0
    ma_guard_pct: 0.03
    target1_pct: 0.15
    target2_pct: 0.20

  breadth:
    enabled: false

  regime:
    use_long: true
    use_short: true

# =========================
# BACKTEST / SIM (KEY AREA)
# =========================
backtest:
  snapshot_mode: "auto"

  # ✅ MASTER SWITCHES
  regime:
    use_long: true
    use_short: true   # <<< THIS IS REQUIRED

  # Coppock (keep shorts free for now)
  coppock:
    use_long: true
    use_short: false

  # Breadth: only gates LONGS
  breadth:
    enabled: true
    ma_window: 50
    min_long: 0.60

  # =====================
  # MARKET REGIME GATES
  # =====================
  market:
    # LONG gate
    require_rising_ma30: true
    ma30_slope_min: 0.0
    vix_max: 25.0

    # SHORT gate (NEW)
    require_falling_ma30: true
    ma30_slope_min_short: 0.0

  # =====================
  # INDUSTRY FILTERS
  # =====================
  industry:
    enabled: true
    require_stage2: true
    min_stage2_frac: 0.30
    require_rising_ma30: true
    require_rising_rs: true

  logging:
    show_adx_skips: false
    show_breadth_skips: false
    show_coppock_skips: false

  # =====================
  # LONG LOGIC
  # =====================
  long:
    break_pct: 0.0060
    vol_min: 1.50
    adx_min: 20.0
    stop_hard: 0.20
    trail_atr: 2.0
    ma_guard: 0.03
    require_ma30_rising: true
    ma30_slope_min: 0.0

  # =====================
  # SHORT LOGIC (ACTIVE)
  # =====================
  short:
    break_pct: 0.0060
    vol_min: 1.60
    adx_min: 22.0
    stop_hard: 0.18
    trail_atr: 2.0
    ma_guard: 0.04
